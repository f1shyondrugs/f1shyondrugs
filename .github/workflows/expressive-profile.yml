name: Refresh profile

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths:
      - profile.json
      - '.profile/**'

permissions:
  contents: write

concurrency:
  group: expressive-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Render profile with custom project support
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .profile/render.mjs
      - name: Save refreshed profile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets .profile/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh profile'
            git push
          fi
